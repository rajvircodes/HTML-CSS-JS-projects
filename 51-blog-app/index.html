<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickblog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./assets/logo.svg" alt="">
        </div>
        <button class="login-btn">Login
            <img src="./assets/arrow.svg" alt="">
        </button>
    </nav>
    <div class="hero">
        <button id="ai-btn">New:AI featured integrated</button>
        <h1>Your own <span>Bloging</span> <br>Platform <br></h1>
        <p>This is your space to think out loud, to share what matters, and to write without filters. Whether it's one word or a thousand, your story starts right here.</p>

        <form>
            <input type="text" placeholder="Search blog">
            <button>Search</button>
        </form>
    </div>
    <section>
        <div class="menu-links">
            <ul>
                <li>All</li>
                <li>Technology</li>
                <li>Startup</li>
                <li>Lifestyle</li>
                <li>Finance</li>

            </ul>
        </div>
    </section>
</body>
</html>
